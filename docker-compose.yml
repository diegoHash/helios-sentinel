services:
  helios-sentinel:
    build: .
    ports:
      - "${HELIOS_SENTINEL_PORT:-8080}:8080"
    environment:
      HELIOS_SENTINEL_DDBB_URL: "${HELIOS_SENTINEL_DDBB_URL:?HELIOS_SENTINEL_DDBB_URL is required}"
      HELIOS_SENTINEL_DDBB_USERNAME: "${HELIOS_SENTINEL_DDBB_USERNAME:?HELIOS_SENTINEL_DDBB_USERNAME is required}"
      HELIOS_SENTINEL_DDBB_PASS: "${HELIOS_SENTINEL_DDBB_PASS:?HELIOS_SENTINEL_DDBB_PASS is required}"
      HELIOS_SENTINEL_JWT_SECRET: "${HELIOS_SENTINEL_JWT_SECRET:?HELIOS_SENTINEL_JWT_SECRET is required}"
      HELIOS_SENTINEL_MAIL_HOST: "${HELIOS_SENTINEL_MAIL_HOST:-smtp.gmail.com}"
      HELIOS_SENTINEL_MAIL_PORT: "${HELIOS_SENTINEL_MAIL_PORT:-587}"
      HELIOS_SENTINEL_MAIL_USERNAME: "${HELIOS_SENTINEL_MAIL_USERNAME:-}"
      HELIOS_SENTINEL_MAIL_PASSWORD: "${HELIOS_SENTINEL_MAIL_PASSWORD:-}"
      HELIOS_TELEGRAM_BOT_TOKEN: "${HELIOS_TELEGRAM_BOT_TOKEN:-}"
      HELIOS_TELEGRAM_CHAT_ID: "${HELIOS_TELEGRAM_CHAT_ID:-}"
      HELIOS_TELEGRAM_BOT_USERNAME: "${HELIOS_TELEGRAM_BOT_USERNAME:-helios_sentinel_bot}"
      HELIOS_SENTINEL_BOOTSTRAP_ENABLED: "${HELIOS_SENTINEL_BOOTSTRAP_ENABLED:-false}"
      HELIOS_SENTINEL_BOOTSTRAP_USERNAME: "${HELIOS_SENTINEL_BOOTSTRAP_USERNAME:-}"
      HELIOS_SENTINEL_BOOTSTRAP_NAME: "${HELIOS_SENTINEL_BOOTSTRAP_NAME:-}"
      HELIOS_SENTINEL_BOOTSTRAP_EMAIL: "${HELIOS_SENTINEL_BOOTSTRAP_EMAIL:-}"
      HELIOS_SENTINEL_BOOTSTRAP_PASSWORD: "${HELIOS_SENTINEL_BOOTSTRAP_PASSWORD:-}"
      HELIOS_SENTINEL_BOOTSTRAP_ROLE: "${HELIOS_SENTINEL_BOOTSTRAP_ROLE:-ROOT}"
      HELIOS_SENTINEL_BOOTSTRAP_PERMISSIONS: "${HELIOS_SENTINEL_BOOTSTRAP_PERMISSIONS:-ALL_PERMISSIONS}"
    restart: unless-stopped

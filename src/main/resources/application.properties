spring.application.name=helios-sentinel
springdoc.api-docs.enabled=${HELIOS_SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${HELIOS_SWAGGER_ENABLED:false}
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
spring.config.import=${HELIOS_CONFIG_IMPORT:optional:file:.env.prod[.properties]}
spring.cloud.aws.region.static=${AWS_REGION:us-east-1}

spring.datasource.url=${HELIOS_SENTINEL_DDBB_URL:jdbc:mysql://localhost:3306/CaribbeanCloud_Schema}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.password=${HELIOS_SENTINEL_DDBB_PASS}
spring.datasource.username=${HELIOS_SENTINEL_DDBB_USERNAME:root}
application.security.jwt.secret-key=${HELIOS_SENTINEL_JWT_SECRET}
app.encryption.key=${HELIOS_SENTINEL_ENCRYPTION_KEY}
application.security.jwt.expiration=86400000
application.security.jwt.refresh-token.expiration=604800000
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database=mysql
spring.jpa.properties.hibernate.default_batch_fetch_size=500
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
server.port=8080
logging.level.org.springframework.security=DEBUG
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true

# HikariCP specific settings
# Set max-lifetime to 10 minutes (600000 ms) to be shorter than DB wait_timeout,
# preventing "Failed to validate connection" warnings.
spring.datasource.hikari.max-lifetime=600000
logging.level.com.zaxxer.hikari=DEBUG

# Redis Configuration (Ready for deployment / local)
spring.data.redis.host=${HELIOS_SENTINEL_REDIS_HOST:localhost}
spring.data.redis.port=${HELIOS_SENTINEL_REDIS_PORT:6379}
# Changed to 'simple' to avoid connection refused errors locally when Redis isn't running
spring.cache.type=${HELIOS_SENTINEL_CACHE_TYPE:simple}

# SMTP Configuration
spring.mail.host=${HELIOS_SENTINEL_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${HELIOS_SENTINEL_MAIL_PORT:587}
spring.mail.username=${HELIOS_SENTINEL_MAIL_USERNAME:correo@ejemplo.com}
spring.mail.password=${HELIOS_SENTINEL_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Telegram Bot
application.telegram.bot.token=${HELIOS_TELEGRAM_BOT_TOKEN:}
application.telegram.bot.chat-id=${HELIOS_TELEGRAM_CHAT_ID:}
application.telegram.bot.username=${HELIOS_TELEGRAM_BOT_USERNAME:sentinel_bot}

# Explicit, one-time administrative bootstrap. Disabled unless deliberately enabled.
application.bootstrap.enabled=${HELIOS_SENTINEL_BOOTSTRAP_ENABLED:false}
application.bootstrap.username=${HELIOS_SENTINEL_BOOTSTRAP_USERNAME:}
application.bootstrap.name=${HELIOS_SENTINEL_BOOTSTRAP_NAME:}
application.bootstrap.email=${HELIOS_SENTINEL_BOOTSTRAP_EMAIL:}
application.bootstrap.password=${HELIOS_SENTINEL_BOOTSTRAP_PASSWORD:}
application.bootstrap.role=${HELIOS_SENTINEL_BOOTSTRAP_ROLE:ROOT}
application.bootstrap.permissions=${HELIOS_SENTINEL_BOOTSTRAP_PERMISSIONS:ALL_PERMISSIONS}

# Frontend
